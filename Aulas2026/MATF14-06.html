# Parte 1: amplitude, variância e desvio padrão

### 50 minutos

---

## Provocação: qual cidade é mais quente? .tempo[0–8 min]

&lt;img src="images/dispersao_variacao_termica_cnn.png" alt="" width="70%" style="display: block; margin: auto;" /&gt;

.fonte[Fonte: CNN Brasil.]

--

Temperatura (°C) medida em duas cidades, em cinco horários do mesmo dia:

| Cidade | hora 1 | hora 2 | hora 3 | hora 4 | hora 5 | **Média** |
|:---:|:---:|:---:|:---:|:---:|:---:|:---:|
| A | 24 | 26 | 32 | 28 | 25 | **27** |
| B | 20 | 26 | 36 | 28 | 25 | **27** |

--

.caixa-discussao[
Pela média, as cidades são **iguais**. Mas você se vestiria da mesma forma para passar o dia em A e
em B? O que a média **não** está contando?
]

---

## Medidas de tendência central não bastam

- A média, a mediana e a moda resumem os dados com **um único valor**.
- Elas **não** informam o quanto os dados **variam** em torno desse valor.

--

Resumo das duas cidades com o que já sabemos (quartis da aula passada):

| Cidade | \\(Q\_1\\) | Mediana | \\(Q\_3\\) | \\(IQR\\) | Média |
|:---:|:---:|:---:|:---:|:---:|:---:|
| A | 25 | 26 | 28 | 3 | 27 |
| B | 25 | 26 | 28 | 3 | 27 |

--

.caixa-aplicacao[
**Tudo igual**, até a distância interquartil! Mas a cidade B chegou a 20 °C e a 36 °C. Existem
**diferentes** medidas de dispersão, e precisamos saber qual é a mais adequada em cada situação.
]

---

## Medidas de dispersão (variabilidade) .tempo[8–20 min]

- Medem o **grau de variabilidade** dos valores de um conjunto de dados.
- Em geral medem a variabilidade **em torno** de uma medida de tendência central (média ou mediana).

.pull-left[
**Já vimos:**

- Distância interquartil: \\(IQR = Q\_3 - Q\_1\\)
]

.pull-right[
**Hoje:**

- Amplitude total \\((AT)\\)
- Variância \\((var)\\)
- Desvio padrão \\((dp)\\)
- Coeficiente de variação \\((CV)\\)
]

---

## Amplitude total

Sendo \\(x\_{\max}\\) e \\(x\_{\min}\\) o máximo e o mínimo dos dados:

$$
AT = x\_{\max} - x\_{\min}
$$

--

**Cidades:** \\(AT\_A = 32 - 24 = 8\\) °C e \\(AT\_B = 36 - 20 = 16\\) °C.

A "variação térmica de 16 °C" da manchete é exatamente uma **amplitude total**.

--

.pull-left[
.caixa-aplicacao[
**Vantagens**

- Cálculo e interpretação simples.
]
]

.pull-right[
.caixa-discussao[
**Limitações**

- Pode ser influenciada por **outliers**.
- Usa **só dois** valores: não capta a variabilidade entre o máximo e o mínimo.
]
]

---

## Exercício: notas de dois alunos

Dois alunos, A e B, tiveram cinco notas em um curso:

.pull-left[
- **Aluno A:** 2, 10, 6, 6, 6
- **Aluno B:** 2, 6, 10, 4, 8
]

.pull-right[
**a)** Qual é a nota média de cada aluno?

**b)** Qual é a amplitude total das notas?

**c)** Quem teve notas com maior variabilidade?
]

.clear[]

--

.caixa-resposta[
**a)** \\(\bar x\_A = (2+10+6+6+6)/5 = 30/5 = 6\\) e \\(\bar x\_B = (2+6+10+4+8)/5 = 30/5 = 6\\).

**b)** \\(AT\_A = 10 - 2 = 8\\) e \\(AT\_B = 10 - 2 = 8\\).

**c)** Visualmente, o aluno B tem notas **mais afastadas** da média; o aluno A tirou 6 em três das
cinco provas. Mas a amplitude total é **igual**: ela não capta essa diferença.
]

---

## Como medir o afastamento em relação à média? .tempo[20–35 min]

&lt;img src="MATF14-06_files/figure-html/pontos-alunos-1.png" alt="" width="85%" /&gt;

Os **desvios** em relação à média \\((x\_i - \bar x)\\), com os dados ordenados:

| | Notas | Desvios \\(x\_i - 6\\) | Soma dos desvios |
|:---:|:---|:---|:---:|
| A | 2, 6, 6, 6, 10 | \\(-4,\ 0,\ 0,\ 0,\ 4\\) | 0 |
| B | 2, 4, 6, 8, 10 | \\(-4,\ -2,\ 0,\ 2,\ 4\\) | 0 |

--

.caixa-discussao[
A média dos desvios dá **zero** nos dois casos. Isso é azar deste exemplo, ou vale sempre?
]

---

## Os desvios sempre somam zero

Para **qualquer** conjunto de dados:

$$
\sum\_{i=1}^{n}(x\_i - \bar x) = \sum\_{i=1}^{n} x\_i - n\,\bar x = n\,\bar x - n\,\bar x = 0.
$$

Os desvios positivos e negativos se **cancelam**. Uma saída é elevar os desvios **ao quadrado**
antes de somar:

| | Desvios | Desvios ao quadrado | Média dos quadrados |
|:---:|:---|:---|:---:|
| A | \\(-4,\ 0,\ 0,\ 0,\ 4\\) | \\(16,\ 0,\ 0,\ 0,\ 16\\) | \\(32/5 = 6{,}4\\) |
| B | \\(-4,\ -2,\ 0,\ 2,\ 4\\) | \\(16,\ 4,\ 0,\ 4,\ 16\\) | \\(40/5 = 8\\) |

--

.caixa-aplicacao[
Agora o aluno B aparece com **maior** variabilidade (8 contra 6,4). Essa média dos desvios ao
quadrado tem nome: **variância**.
]

---

## Variância

Sejam \\(x\_1, \ldots, x\_n\\) os \\(n\\) valores e \\(\bar x\\) a sua média. A **variância** é

$$
var(X) = \frac{\sum\_{i=1}^{n}(x\_i - \bar x)^2}{n} = \frac{(x\_1 - \bar x)^2 + (x\_2 - \bar x)^2 + \cdots + (x\_n - \bar x)^2}{n}
$$

- **Todos** os valores são usados no cálculo.
- Desvios grandes pesam **muito mais** que desvios pequenos (um desvio de 4 contribui 16; um de 2,
  só 4).

--

.caixa-discussao[
**Observação:** a unidade de medida fica **ao quadrado**. A variância de pesos em kg é um número em
kg². O que significa "27,2 °C²" de variância de temperatura?
]

---

## Desvio padrão

O **desvio padrão** é a **raiz quadrada** da variância:

$$
dp(X) = \sqrt{var(X)} = \sqrt{\frac{\sum\_{i=1}^{n}(x\_i - \bar x)^2}{n}}
$$

--

- Tem a **mesma unidade** dos dados, o que facilita a interpretação.
- Ex.: o desvio padrão de pesos em kg também está em kg.

--

**Alunos:** \\(dp\_A = \sqrt{6{,}4} \approx 2{,}53\\) e \\(dp\_B = \sqrt{8} \approx 2{,}83\\) pontos.

.caixa-aplicacao[
Leitura: as notas do aluno B se afastam da média, "tipicamente", cerca de 2,8 pontos; as do aluno A,
cerca de 2,5 pontos.
]

---

## Exercício: desvio padrão das cidades .tempo[35–50 min]

Calcule o desvio padrão da temperatura de cada cidade. Qual tem maior variabilidade?

--

.pull-left[.small[
**Cidade A** \\((\bar x = 27)\\)

| \\(x\_i\\) | \\(x\_i - 27\\) | \\((x\_i - 27)^2\\) |
|:---:|:---:|:---:|
| 24 | \\(-3\\) | 9 |
| 26 | \\(-1\\) | 1 |
| 32 | 5 | 25 |
| 28 | 1 | 1 |
| 25 | \\(-2\\) | 4 |
| **Soma** | **0** | **40** |

\\(var = 40/5 = 8\\) \\(\Rightarrow dp\_A = \sqrt 8 \approx 2{,}83\\) °C
]]

.pull-right[.small[
**Cidade B** \\((\bar x = 27)\\)

| \\(x\_i\\) | \\(x\_i - 27\\) | \\((x\_i - 27)^2\\) |
|:---:|:---:|:---:|
| 20 | \\(-7\\) | 49 |
| 26 | \\(-1\\) | 1 |
| 36 | 9 | 81 |
| 28 | 1 | 1 |
| 25 | \\(-2\\) | 4 |
| **Soma** | **0** | **136** |

\\(var = 136/5 = 27{,}2\\) \\(\Rightarrow dp\_B = \sqrt{27{,}2} \approx 5{,}22\\) °C
]]

.clear[]

--

.caixa-resposta[
A cidade **B** tem maior variabilidade: seu desvio padrão é quase o **dobro** do de A. O \\(IQR\\)
(igual a 3 nas duas) não enxergava isso, porque só olha os 50% centrais.
]

# Parte 2: coeficiente de variação e aplicações

### 50 minutos

---

## Comparando variabilidades de naturezas diferentes .tempo[0–12 min]

Às vezes queremos comparar a variabilidade de dados de **naturezas diferentes**: pesos e alturas,
taxas de juros e receitas, notas de 0 a 10 e temperaturas.

--

| Variável | Média | \\(AT\\) | \\(dp\\) |
|:---|:---:|:---:|:---:|
| Temperatura da cidade B (°C) | 27 | 16 | 5,22 |
| Notas do aluno B (pontos) | 6 | 8 | 2,83 |

--

.caixa-discussao[
**Cuidado!** Dados de magnitude alta tendem a ter desvio padrão mais alto. A temperatura "varia
mais" que as notas só porque seus valores são maiores? Uma opção é **normalizar** a medida de
variabilidade **pela média**.
]

---

## Coeficiente de variação

Sejam \\(\bar x\\) e \\(dp(X)\\) a média e o desvio padrão dos valores \\(x\_1, \ldots, x\_n\\). O
**coeficiente de variação** é

$$
CV(X) = \frac{dp(X)}{\bar x}
$$

É **adimensional** (a unidade se cancela) e costuma ser apresentado em **porcentagem**.

--

| Variável | Média | \\(AT\\) | \\(dp\\) | \\(CV\\) |
|:---|:---:|:---:|:---:|:---:|
| Temperatura da cidade B | 27 | 16 | 5,22 | \\(5{,}22/27 \approx 0{,}19\\) (19%) |
| Notas do aluno B | 6 | 8 | 2,83 | \\(2{,}83/6 \approx 0{,}47\\) (47%) |

--

.caixa-aplicacao[
Em termos **relativos** à própria média, as notas do aluno B são **mais de duas vezes** mais
dispersas que a temperatura da cidade B. O \\(CV\\) inverteu a conclusão do desvio padrão.
]

---

## Duas ações com o mesmo retorno médio .tempo[12–24 min]

Retorno anual (%) de duas ações nos últimos 5 anos:

&lt;img src="MATF14-06_files/figure-html/fig-duas-acoes-1.png" alt="" width="85%" /&gt;

| Ação | Retornos (%) | Média | \\(dp\\) | \\(CV\\) |
|:---:|:---|:---:|:---:|:---:|
| A | 8, 10, 12, 14, 16 | 12 | \\(\sqrt{8} \approx 2{,}83\\) | 0,24 |
| B | \\(-30\\), 5, 15, 25, 45 | 12 | \\(\sqrt{616} \approx 24{,}8\\) | 2,07 |

---

## A conta da ação B, passo a passo

| Retorno \\(x\_i\\) | \\(x\_i - 12\\) | \\((x\_i - 12)^2\\) |
|:---:|:---:|:---:|
| \\(-30\\) | \\(-42\\) | 1.764 |
| 5 | \\(-7\\) | 49 |
| 15 | 3 | 9 |
| 25 | 13 | 169 |
| 45 | 33 | 1.089 |
| **Soma** | **0** | **3.080** |

$$
var = \frac{3.080}{5} = 616 \qquad dp = \sqrt{616} \approx 24{,}8 \text{ pontos percentuais}
$$

.caixa-economia[
Em finanças, o desvio padrão dos retornos é a medida mais simples de **risco** (volatilidade). A
média, sozinha, esconde que a ação B perdeu 30% em um dos anos.
]

## Empresas: faturamento ou número de empregados? .tempo[24–32 min]


``` r
empresas |&gt; summarise(
  media_fat = mean(faturamento99), dp_fat = dp_n(faturamento99),
  media_emp = mean(empregados99),  dp_emp = dp_n(empregados99)) |&gt;
  mutate(cv_fat = dp_fat / media_fat, cv_emp = dp_emp / media_emp) |&gt; round(3)
```

```
##   media_fat   dp_fat media_emp dp_emp cv_fat cv_emp
## 1  334264.9 105291.7    60.736 67.947  0.315  1.119
```

--

.caixa-aplicacao[
O desvio padrão do faturamento (≈ 105 mil) é milhares de vezes maior que o do número de empregados
(≈ 68), mas as unidades são **incomparáveis**. Pelo \\(CV\\), o número de empregados é **muito mais
disperso** em termos relativos (112% contra 31%).
]

## Dispersão relativa dentro de cada porte


``` r
empresas |&gt; group_by(porte) |&gt;
  summarise(n = n(), media = mean(faturamento99), dp = dp_n(faturamento99)) |&gt;
  mutate(cv = dp / media) |&gt; arrange(cv)
```

## Atividade 3: escolhendo a medida certa .tempo[40–46 min]

**1.** Volte às duas ações. Um investidor avesso a risco que olhasse só a média divulgada pelo banco
cometeria que erro? Que número você exigiria ver ao lado da média?

**2.** O \\(IQR\\) das duas cidades é igual, mas o desvio padrão é muito diferente. Em que situação o
\\(IQR\\) seria a medida **preferível**? (Pense em um sensor de temperatura com defeito que registra
um único valor de 60 °C.)

--

**3.** Manchete: "variação térmica de 16 °C". Subtítulo: "temperaturas oscilam entre 17 °C e
35 °C na região". Os dois números são compatíveis? O que cada um está medindo?

---

## Atividade 3 (cont.): os limites do coeficiente de variação

**4.** Uma notícia afirma que "o Brasil é mais desigual que outro país" citando só a **renda média**
per capita dos dois. Que medida de dispersão seria indispensável para essa afirmação fazer sentido?

**5.** O \\(CV\\) pode enganar quando a média é **próxima de zero**. Explique por quê (o que acontece
com uma fração quando o denominador se aproxima de zero?) e dê um exemplo econômico: lucro trimestral
de uma empresa que alterna prejuízos e lucros, saldo da balança comercial...

**6.** Faz sentido calcular o \\(CV\\) de temperaturas em graus Celsius? E se as mesmas temperaturas
fossem medidas em Fahrenheit, o \\(CV\\) mudaria?

--

.caixa-resposta[
**6.** Muda. Ao converter para Fahrenheit \\((F = 1{,}8\,C + 32)\\), o desvio padrão é multiplicado
por 1,8, mas a média ganha também o "+32": a razão \\(dp/\bar x\\) se altera. O \\(CV\\) das
temperaturas em °C que usamos acima só vale **nessa escala**. Por isso o \\(CV\\) é mais confiável
para variáveis com **zero absoluto** (renda, peso, número de empregados).
]

## Uso do R: medidas de dispersão .tempo[46–50 min]


``` r
b &lt;- c(20, 26, 36, 28, 25)        # temperaturas da cidade B

max(b) - min(b)                   # amplitude total: 16
diff(range(b))                    # o mesmo, 16
IQR(b)                            # distância interquartil

var(b)                            # 34  &lt;- ATENÇÃO: divide por n - 1
sd(b)                             # 5,83

# as fórmulas desta aula dividem por n:
var_n &lt;- function(x) mean((x - mean(x))^2)
var_n(b)                          # 27,2
sqrt(var_n(b))                    # 5,22
sqrt(var_n(b)) / mean(b)          # CV: 0,19
```

.caixa-r[
`var()` e `sd()` do R dividem por \\(n-1\\) (versão **amostral**, que você verá em Inferência).
Nesta disciplina e nas provas usamos o divisor \\(n\\), como no formulário.
]

---

## Uso do R: com a base de empresas


``` r
library(tidyverse)
empresas &lt;- read.csv("empresas.csv")

empresas |&gt;
  group_by(porte) |&gt;
  summarise(
    AT  = max(faturamento99) - min(faturamento99),
    IQR = IQR(faturamento99),
    dp  = sqrt(mean((faturamento99 - mean(faturamento99))^2)),
    CV  = dp / mean(faturamento99)
  )
```

.caixa-r[
**Exercício:** repita para `empregados99` e para a idade dos prefeitos (`dados_prefeitos.csv`) por
`Regiao`. Em qual região a idade dos prefeitos é mais homogênea?
]

---

## Resumo

- **Medidas de dispersão** medem a variabilidade dos dados.
- **Distância interquartil:** \\(Q\_3 - Q\_1\\), só os 50% centrais; robusta a extremos.
- **Amplitude total:** \\(x\_{\max} - x\_{\min}\\); simples, mas usa só dois valores.
- **Variância:** média dos desvios ao quadrado; unidade ao quadrado.
- **Desvio padrão:** \\(dp = \sqrt{var}\\); mesma unidade dos dados.
- **Coeficiente de variação:** \\(CV = dp/\bar x\\); adimensional, compara variabilidades
  **relativas** (só para variáveis com zero absoluto e média longe de zero).
- A escolha da medida depende do **tipo de dado** e da **pergunta** da análise.
