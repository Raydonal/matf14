# Aula 15: Revisão intermediária + exercícios

## Unidade 1 (já avaliada em P1) e Unidade 2 (entra em P2, junto com a Unidade 3)

---

## Mapa da Unidade 1: Estatística Descritiva

| Tópico | Fórmula-chave |
|---|---|
| Média | \(\bar x = \frac1n\sum\_i x\_i\) |
| Mediana | valor central dos dados ordenados |
| Quartis / IQR | \(Q\_1,Q\_2,Q\_3\); \(IQR=Q\_3-Q\_1\) |
| Variância | \(\mathrm{Var}(X)=\frac1n\sum\_i(x\_i-\bar x)^2\) |
| Desvio padrão | \(dp(X)=\sqrt{\mathrm{Var}(X)}\) |
| CV | \(dp(X)/\bar x\) |
| Correlação | \(r=\frac{\sum(x\_i-\bar x)(y\_i-\bar y)}{\sqrt{\sum(x\_i-\bar x)^2}\sqrt{\sum(y\_i-\bar y)^2}}\) |
| Assimetria | 3º momento padronizado |

---

## Mapa da Unidade 2: Probabilidade

| Tópico | Fórmula-chave |
|---|---|
| Axiomas | \(P(A)\ge0\), \(P(\Omega)=1\), aditividade |
| Adição geral | \(P(A\cup B)=P(A)+P(B)-P(A\cap B)\) |
| Equiprovável | \(P(A)=\#A/\#\Omega\) |
| Combinação | \(\binom{n}{k}=\frac{n!}{k!(n-k)!}\) |
| Condicional | \(P(A\mid B)=\frac{P(A\cap B)}{P(B)}\) |
| Independência | \(P(A\cap B)=P(A)P(B)\) |
| Prob. total | \(P(A)=\sum\_i P(A\mid B\_i)P(B\_i)\) |
| Bayes | \(P(B\_i\mid A)=\frac{P(A\mid B\_i)P(B\_i)}{\sum\_j P(A\mid B\_j)P(B\_j)}\) |

---

## Os 5 erros mais comuns em prova (edições anteriores)

1. Confundir divisor \(n\) (descritiva, usado neste curso) com \(n-1\) (o `var()` do R).
2. Aplicar \(P(A\cup B)=P(A)+P(B)\) sem checar se \(A,B\) são mutuamente exclusivos.
3. Confundir "mutuamente exclusivos" com "independentes" (são opostos, não sinônimos, quando
   ambas têm probabilidade positiva).
4. Esquecer de calcular \(P(A)\) (probabilidade total) antes de aplicar Bayes.
5. Interpretar \(r\approx 0\) como "não há relação nenhuma", ignorando que \(r\) só mede relação
   **linear**.

---

# Agora, quatro problemas resolvidos

## Cobrindo os pontos mais cobrados em prova nas duas unidades

---

## Roteiro dos exercícios

Tente resolver cada um por conta própria antes de ver a solução no slide seguinte (clique para
avançar), e, mais importante: para cada um, tente antecipar *qual erro conceitual*, dos cinco
listados acima, um colega desatento cometeria antes de olhar a solução.

1. Média/mediana/assimetria com dado agrupado.
2. Coeficiente de variação, comparação entre variáveis.
3. Probabilidade condicional com tabela de dupla entrada.
4. Teorema de Bayes, dois estágios.

---

## Problema 1

Os prêmios pagos (em R$ mil) por uma seguradora em 7 sinistros do mês foram:
\(12, 15, 14, 13, 16, 14, 95\). Calcule média e mediana, e diga o que a comparação entre elas revela.

--

**Solução.** Soma \(=179\), \(n=7\), \(\bar x = 179/7\approx 25{,}57\). Ordenados:
\(12,13,14,14,15,16,95\), mediana (4º valor) \(=14\).

--

Média \(\gg\) mediana \(\Rightarrow\) assimetria forte à direita: um sinistro atípico (R$ 95 mil,
possivelmente um evento raro de grande porte) puxa a média muito acima do "sinistro típico" do mês
(mediana R$ 14 mil).

**Erro comum a evitar**: reportar só a média ("prêmio médio pago: R$ 25,57 mil") sem checar a
mediana, dá uma falsa impressão de que sinistros "grandes" são o padrão, não a exceção.

---

## Problema 2

Uma corretora compara dois ativos: Ativo X (retorno médio 8%, dp 2%) e Ativo Y (retorno médio 20%,
dp 4%). Qual ativo é relativamente mais arriscado?

--

**Solução.** Desvio padrão bruto sugere Y (4% &gt; 2%), mas as médias são muito diferentes, então
compare via \(CV\):

$$
CV\_X = 2/8 = 0{,}25 \qquad CV\_Y = 4/20 = 0{,}20
$$

X é **relativamente** mais arriscado (maior dispersão por unidade de retorno esperado), mesmo com
desvio padrão absoluto menor que Y.

**Erro comum a evitar**: comparar diretamente os desvios padrão (4% vs. 2%) sem normalizar pela
média, é o erro mais frequente de prova nesse tipo de questão.

---

## Problema 3

De 300 clientes de um banco, 180 têm conta poupança, 90 têm cartão de crédito, e 50 têm ambos.
Escolhendo um cliente ao acaso, qual a probabilidade de ter cartão de crédito, dado que tem
poupança?

--

**Solução.** \(B=\)"poupança" (\(P(B)=180/300\)), \(A=\)"cartão" (\(P(A\cap B)=50/300\), a interseção
"ambos"):

$$
P(A\mid B) = \frac{P(A\cap B)}{P(B)} = \frac{50/300}{180/300} = \frac{50}{180} \approx 0{,}278
$$

**Erro comum a evitar**: usar \(90/300\) (a probabilidade não condicional de ter cartão) em vez de
condicionar corretamente ao subconjunto "tem poupança".

---

## Problema 4

Uma fábrica recebe peças de dois fornecedores: 70% do fornecedor A (taxa de defeito 2%) e 30% do
fornecedor B (taxa de defeito 8%). Uma peça é sorteada e está defeituosa. Qual a probabilidade de
ter vindo do fornecedor B?

--

**Solução.** \(P(A)=0{,}7\), \(P(B)=0{,}3\), \(P(D\mid A)=0{,}02\), \(P(D\mid B)=0{,}08\).


``` r
p_D &lt;- 0.02*0.7 + 0.08*0.3
p_B_dado_D &lt;- (0.08*0.3)/p_D
round(p_B_dado_D, 3)
```

```
## [1] 0.632
```

Apesar de o fornecedor B fornecer só 30% das peças, ele responde por
63% das peças defeituosas, sua taxa de defeito 4x maior pesa
mais que sua participação menor.

**Erro comum a evitar**: esquecer de calcular \(P(D)\) (probabilidade total) antes de aplicar Bayes,
ou confundir \(P(D\mid B)\) com \(P(B\mid D)\) (a própria pergunta do problema).

---

## Discussão: a prova não é só conta

Nas provas anteriores desta disciplina, a diferença entre uma resposta de nota alta e uma de nota
mediana raramente está no cálculo em si: está na **interpretação** que acompanha o número.
Reserve um tempo para responder, sem consultar nada, cada uma destas perguntas de síntese:

**1.** Dos cinco erros comuns listados no início da aula, qual você mais reconheceu em si mesmo ao
tentar resolver os quatro problemas antes de ver a solução?

**2.** Se uma questão pedir para calcular uma correlação e depois perguntar "isso prova que \(X\)
causa \(Y\)?", que resposta em uma frase você daria, e que exemplo alternativo (variável de
confusão) você citaria para justificá-la?

**3.** Se uma questão de Bayes pedir a probabilidade de uma "causa" dado um "sintoma"/"evidência",
e você só tiver \(P(\text{sintoma}\mid\text{causa})\), que passo intermediário você **precisa**
calcular antes de aplicar a fórmula final?

**4.** Escolha um dos quatro problemas resolvidos e reformule o enunciado trocando o contexto
(seguro por mercado de trabalho, crédito por eleição, etc.), mantendo a mesma estrutura matemática.
Isso ajuda a confirmar que você entendeu a lógica, não decorou o contexto específico.

---
