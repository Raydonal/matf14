## Mapa da Unidade 2

.small[

| Tópico | O essencial |
|:---|:---|
| Espaço amostral e eventos | \\(S\\); eventos são subconjuntos; \\(\cup\\), \\(\cap\\), complementar; De Morgan |
| Axiomas | \\(P(A) \geq 0\\), \\(P(S) = 1\\), aditividade; \\(P(A \cup B) = P(A) + P(B) - P(A \cap B)\\); Boole |
| Clássica e contagem | \\(P(A) = \\#A/\\#S\\) **só** se equiprovável; \\(n^r\\), \\(n!/(n-r)!\\), \\(\binom{n}{r}\\); hipergeométrica |
| Geométrica | razão de comprimentos ou áreas |
| Condicional e tabelas | \\(P(B \mid A) = P(A \cap B)/P(A)\\); conjunta, marginal, perfis linha e coluna; Simpson |
| Independência | \\(P(A \cap B) = P(A)P(B)\\); independentes \\(\neq\\) disjuntos |
| Risco e chance | \\(RR = R\_1/R\_0\\); \\(O = p/(1-p)\\); \\(OR = ad/(bc)\\) |
| Total e Bayes | \\(P(A) = \sum P(A \mid B\_i)P(B\_i)\\); \\(P(B\_j \mid A) \propto P(A \mid B\_j)P(B\_j)\\); VPP depende da prevalência |

]

## Os erros mais comuns em prova

1. Usar a **fórmula errada** para o tipo de variável (média de uma variável nominal).
2. Calcular a **mediana sem ordenar** os dados, ou esquecer o caso de \\(n\\) par.
3. Dividir a variância por \\(n - 1\\) quando o formulário pede \\(n\\) (ou vice-versa sem avisar).
4. Somar \\(P(A) + P(B)\\) sem descontar \\(P(A \cap B)\\) quando os eventos **não** são disjuntos.
5. Confundir \\(P(A \mid B)\\) com \\(P(B \mid A)\\), ou com \\(P(A \cap B)\\).
6. Tratar eventos **disjuntos** como **independentes**.
7. Em "pelo menos um", fazer contas longas em vez de usar o **complementar**.
8. Dividir casos favoráveis por casos possíveis quando os resultados **não** são igualmente prováveis.
9. Ler uma razão de chances como se fosse risco relativo.

## Exercício 1: espaço amostral e eventos .tempo[10–22 min]

Descreva os elementos do espaço amostral e do evento indicado:

**a)** Dois dados são lançados independentemente. \\(A\\): a soma das faces é sete.

**b)** Uma moeda e um dado são lançados e observamos os dois resultados. \\(B\\): obter o número três no
dado.

**c)** Numa linha de produção, contamos o número de peças defeituosas em 1 hora. \\(C\\): obter pelo
menos 3 peças defeituosas.

--

.caixa-resposta[
**a)** \\(S = \\{(1,1), (1,2), \ldots, (6,6)\\}\\), com 36 elementos.
\\(A = \\{(1,6), (2,5), (3,4), (4,3), (5,2), (6,1)\\}\\).

**b)** \\(S = \\{(1,K), (1,C), \ldots, (6,K), (6,C)\\}\\), com 12 elementos. \\(B = \\{(3,K), (3,C)\\}\\).

**c)** \\(S = \\{0, 1, 2, 3, \ldots\\}\\) (enumerável, sem limite). \\(C = \\{3, 4, 5, \ldots\\}\\).
]

## Exercício 2: doação de sangue

Na população de um país, a distribuição do tipo sanguíneo é: **45%** tipo O, **40%** tipo A, **11%**
tipo B e o restante tipo AB. Três pessoas **independentes** se voluntariam para doar sangue. Qual é
a probabilidade de:

**a)** todos os doadores terem sangue do tipo O?

**b)** nenhum ter sangue do tipo AB?

**c)** nem todos terem sangue do tipo A?

--

.caixa-resposta[
**a)** \\(0{,}45 \times 0{,}45 \times 0{,}45 \approx 0{,}0911\\).

**b)** \\(P(AB) = 1 - 0{,}45 - 0{,}40 - 0{,}11 = 0{,}04\\), logo \\(P(\text{não } AB) = 0{,}96\\) e
\\(0{,}96^3 \approx 0{,}8847\\).

**c)** \\(P(\text{todos } A) = 0{,}4^3 = 0{,}064\\). Pelo complementar, \\(P(\text{nem todos } A) = 1 - 0{,}064 = 0{,}936\\).
]

---

## Exercício 3: auditoria por amostragem .tempo[22–37 min]

Um lote tem **15 contratos**, dos quais **4** têm cláusulas irregulares. A auditoria sorteia **3** contratos,
sem reposição.

**a)** Quantas amostras diferentes são possíveis? **b)** Qual a probabilidade de a amostra conter **exatamente
um** contrato irregular? **c)** E de conter **pelo menos um**?

--

.caixa-resposta[
**a)** \\(\binom{15}{3} = 455\\) amostras (a ordem não importa).

**b)** \\(\dfrac{\binom{4}{1}\binom{11}{2}}{\binom{15}{3}} = \dfrac{4 \times 55}{455} = \dfrac{220}{455} \approx 0{,}484\\).

**c)** \\(1 - \dfrac{\binom{11}{3}}{\binom{15}{3}} = 1 - \dfrac{165}{455} \approx 0{,}637\\).
]

---

## Exercício 4: probabilidade geométrica

Um entregador chega a um condomínio num instante ao acaso entre 14h e 15h. O porteiro faz uma pausa de 20
minutos que começa num instante ao acaso entre 14h e 14h40, independentemente do entregador.

**a)** Qual a probabilidade de o entregador chegar **durante** a pausa? (Dica: desenhe o retângulo
\\([0, 40] \times [0, 60]\\), com o início da pausa \\(u\\) no eixo horizontal e a chegada \\(t\\) no vertical.)

--

.caixa-resposta[
O evento é \\(u \leq t \leq u + 20\\): para cada \\(u\\) entre 0 e 40, uma faixa vertical de altura 20. Área favorável:
\\(40 \times 20 = 800\\); área total: \\(40 \times 60 = 2.400\\). Logo \\(P = 800/2.400 = 1/3\\). Faz sentido: qualquer que seja
o início, a pausa cobre 20 dos 60 minutos.
]

---

## Exercício 5: preocupação com a segurança da comida .tempo[37–50 min]

Pessoas foram questionadas se concordam com a frase "Estou preocupado com a segurança da comida que
consumo":

| Idade | Concorda | Sem opinião | Discorda | Não sabe | Total |
|:---:|:---:|:---:|:---:|:---:|:---:|
| 13–19 | 661 | 368 | 452 | 32 | 1.513 |
| 20–29 | 816 | 365 | 336 | 16 | 1.533 |
| 30–39 | 871 | 355 | 290 | 9 | 1.525 |
| 40–49 | 914 | 335 | 266 | 6 | 1.521 |
| 50+ | 966 | 339 | 283 | 10 | 1.598 |
| **Total** | 4.228 | 1.762 | 1.627 | 73 | 7.690 |

Sorteando alguém dessa amostra, qual é a probabilidade de que ele: **a)** tenha menos de 50 anos
**e** tenha concordado? **b)** tenha menos de 50 anos **ou** tenha concordado?

---

## Exercício 5: resolução

Seja \\(M\\) = {menos de 50 anos} e \\(C\\) = {concorda}.

--

**a)** \\(M \cap C\\): somar a coluna "Concorda" nas quatro primeiras linhas.

$$
P(M \cap C) = \frac{661 + 816 + 871 + 914}{7.690} = \frac{3.262}{7.690} \approx 0{,}42
$$

--

**b)** \\(P(M) = \frac{7.690 - 1.598}{7.690} = \frac{6.092}{7.690}\\) e \\(P(C) = \frac{4.228}{7.690}\\).

$$
P(M \cup C) = \frac{6.092 + 4.228 - 3.262}{7.690} = \frac{7.058}{7.690} \approx 0{,}92
$$

.caixa-aplicacao[
**Atalho pelo complementar:** \\((M \cup C)^c\\) = "50+ **e** não concorda" \\(= 339 + 283 + 10 = 632\\), e
\\(1 - 632/7.690 = 7.058/7.690\\).
]

## Exercício 6: compras online .tempo[0–10 min]

Uma empresa quer saber se seus compradores estão preocupados com transações online. Das **42**
pessoas da amostra, **24** estão preocupadas e **18** não estão. **Oito** das preocupadas são homens
e **seis** das não preocupadas são homens.

Selecionando um respondente ao acaso, qual é a probabilidade de ele:

**a)** ser homem, dado que **não** está preocupado?
**b)** **não** estar preocupado, dado que é mulher?
**c)** ser mulher, dado que está preocupado?

--

.pull-left-40[
| | Homem | Mulher | Total |
|:---|:---:|:---:|:---:|
| Preocupado | 8 | 16 | 24 |
| Não preocupado | 6 | 12 | 18 |
| **Total** | 14 | 28 | 42 |
]

.pull-right-60[
.caixa-resposta[
Primeiro, **monte a tabela** (à esquerda).

**a)** \\(6/18 \approx 0{,}33\\). **b)** \\(12/28 \approx 0{,}43\\). **c)** \\(16/24 \approx 0{,}67\\).
]

.caixa-discussao[
\\(P(H \mid \text{não preoc.}) = 6/18 = 1/3\\) e \\(P(H) = 14/42 = 1/3\\). O que isso diz sobre sexo e
preocupação?
]
]

---

## Exercício 7: desocupação e sexo (PNAD Contínua) .tempo[10–22 min]

Força de trabalho no 2º trimestre de 2026 (mil pessoas):

| | Desocupadas | Ocupadas | Total |
|:---|:---:|:---:|:---:|
| Mulheres | 3.059 | 44.765 | 47.824 |
| Homens | 2.803 | 58.293 | 61.096 |
| **Total** | 5.862 | 103.058 | 108.920 |

.fonte[Fonte: IBGE, PNAD Contínua, tabela 4093 (totais recalculados a partir das células).]

**a)** Calcule a taxa de desocupação de mulheres e de homens. **b)** Qual a proporção de mulheres **entre** os
desocupados? **c)** Calcule \\(RR\\) e \\(OR\\) de desocupação das mulheres em relação aos homens.

---

## Exercício 7: resolução

.caixa-resposta[
**a)** Mulheres: \\(3.059/47.824 \approx 0{,}064\\); homens: \\(2.803/61.096 \approx 0{,}046\\).

**b)** \\(P(\text{mulher} \mid \text{desocupada}) = 3.059/5.862 \approx 0{,}522\\). Não confunda com (a): mesmo numerador, denominador
diferente.

**c)** \\(RR = 0{,}064/0{,}046 \approx 1{,}39\\); \\(OR = \dfrac{3.059 \times 58.293}{44.765 \times 2.803} \approx 1{,}42\\). Como a desocupação é
relativamente rara, \\(OR \approx RR\\).
]

.caixa-discussao[
Uma manchete diz: "mulheres são a maioria dos desocupados". Outra: "a taxa de desocupação das mulheres é 39% maior".
As duas estão certas? Qual delas informa melhor sobre o **risco** de uma mulher estar desocupada?
]

---

## Exercício 8: exame de sangue .tempo[22–38 min]

Um exame de sangue tem eficiência de **95%** na detecção de uma doença quando ela está presente. O
teste também dá "falso positivo" em **1%** das pessoas saudáveis. Se **0,5%** da população tem a
doença, qual é a probabilidade de uma pessoa ter a doença **dado que** o resultado é positivo?

--

.caixa-resposta[
Partição: \\(D\\) (doente) e \\(D^c\\). Informação: \\(+\\) (positivo).

\\(P(D) = 0{,}005\\), \\(P(D^c) = 0{,}995\\), \\(P(+ \mid D) = 0{,}95\\), \\(P(+ \mid D^c) = 0{,}01\\).

\\(P(D \mid +) = \dfrac{0{,}95 \times 0{,}005}{0{,}95 \times 0{,}005 + 0{,}01 \times 0{,}995} = \dfrac{0{,}00475}{0{,}00475 + 0{,}00995} = \dfrac{0{,}00475}{0{,}0147} \approx 0{,}323\\).
]

--

.caixa-discussao[
Com um exame "95% eficiente", **dois em cada três** positivos são pessoas saudáveis. Por que
exames de triagem costumam ser **repetidos** antes do diagnóstico?
]

---

## Exercício 9: pressão e colesterol

Uma empresa pensa em produzir uma pílula para controlar pressão **e** colesterol altos. Proporções de
adultos:

| | Pressão alta | Pressão normal |
|:---|:---:|:---:|
| Colesterol alto | 0,11 | 0,21 |
| Colesterol normal | 0,16 | 0,52 |

Um adulto é selecionado ao acaso. Qual é a probabilidade de ele ter: **a)** pressão alta **ou**
colesterol alto? **b)** pressão alta **e** colesterol alto? **c)** pressão alta, **dado que** tem
colesterol alto?

--

.caixa-resposta[
**a)** \\(0{,}11 + 0{,}16 + 0{,}21 = 0{,}48\\) (ou \\(1 - 0{,}52\\)). **b)** \\(0{,}11\\).

**c)** \\(P(PA \mid CA) = \dfrac{0{,}11}{0{,}11 + 0{,}21} = \dfrac{0{,}11}{0{,}32} \approx 0{,}34\\).
]

---

## A prova não é só conta .tempo[38–46 min]

**1.** No exercício 8, o que acontece com \\(P(D \mid +)\\) se o exame for aplicado **só** em pessoas com
sintomas, entre as quais 20% têm a doença? Refaça a conta.

**2.** No exercício 9, pressão alta e colesterol alto são **independentes**? Justifique com números.

**3.** No exercício 3, calcule a probabilidade de **nenhum** contrato irregular de duas formas: com combinações e com a
regra da multiplicação (\\(\frac{11}{15} \cdot \frac{10}{14} \cdot \frac{9}{13}\\)). Por que dão o mesmo resultado?

--

.caixa-resposta[
**1.** \\(\frac{0{,}95 \times 0{,}2}{0{,}95 \times 0{,}2 + 0{,}01 \times 0{,}8} = \frac{0{,}19}{0{,}198} \approx 0{,}96\\).
**2.** \\(P(PA)P(CA) = 0{,}27 \times 0{,}32 = 0{,}0864 \neq 0{,}11\\): **dependentes**.
**3.** \\(\frac{165}{455} = \frac{11 \cdot 10 \cdot 9}{15 \cdot 14 \cdot 13} \approx 0{,}363\\): contar subconjuntos ou multiplicar condicionais descreve o mesmo sorteio.
]

## Uso do R: conferindo as contas .tempo[46–50 min]


``` r
c(ex3b = choose(4, 1) * choose(11, 2) / choose(15, 3), ex3c = 1 - choose(11, 3) / choose(15, 3))
```

```
##      ex3b      ex3c 
## 0.4835165 0.6373626
```

``` r
c(RR = (3059 / 47824) / (2803 / 61096), OR = (3059 * 58293) / (44765 * 2803))
```

```
##       RR       OR 
## 1.394194 1.421131
```

``` r
bayes &lt;- function(priori, verossim) priori * verossim / sum(priori * verossim)
bayes(c(0.005, 0.995), c(0.95, 0.01))   # exame de sangue: P(D | +) e P(D^c | +)
```

```
## [1] 0.3231293 0.6768707

## Mapa da Unidade 1

| Tópico | O essencial |
|:---|:---|
| Tipos de variáveis | qualitativa (nominal, ordinal); quantitativa (discreta, contínua) |
| Tabelas e gráficos | frequência absoluta e relativa; classes; histograma |
| Tendência central | moda, mediana \\((n\\) par ou ímpar\\()\\), média \\(\bar x = \frac{1}{n}\sum x\_i = \sum f\_i x\_i\\) |
| Separatrizes | percentil: \\(k = P \cdot n/100\\); quartis; \\(IQR = Q\_3 - Q\_1\\); boxplot |
| Dispersão | \\(AT\\), \\(var = \frac{1}{n}\sum (x\_i - \bar x)^2\\), \\(dp = \sqrt{var}\\), \\(CV = dp/\bar x\\) |
| Associação | \\(cor(X,Y) = \frac{1}{n}\sum \frac{(x\_i - \bar x)}{dp(X)}\frac{(y\_i - \bar y)}{dp(Y)}\\) |
| Forma | assimetria (ref. 0) e curtose (ref. 3) |

## Extra A: crianças por domicílio

O número de crianças em 20 casas visitadas numa pesquisa foi:

$$
2,\ 0,\ 0,\ 1,\ 5,\ 3,\ 4,\ 0,\ 1,\ 1,\ 2,\ 1,\ 3,\ 0,\ 4,\ 6,\ 3,\ 2,\ 0,\ 2
$$

**a)** Construa uma tabela de frequências absolutas.

Usando a tabela de frequências, calcule: **b)** a moda; **c)** a mediana; **d)** a média; **e)** a
variância.

---

## Extra A: resolução

.pull-left-40[
| Nº de crianças | Freq. abs. | Acumulada |
|:---:|:---:|:---:|
| 0 | 5 | 5 |
| 1 | 4 | 9 |
| 2 | 4 | 13 |
| 3 | 3 | 16 |
| 4 | 2 | 18 |
| 5 | 1 | 19 |
| 6 | 1 | 20 |
| **Total** | **20** | |
]

.pull-right-60[
**b)** Moda \\(= 0\\) (frequência 5).

**c)** \\(n = 20\\) é par: média das posições 10 e 11. As duas estão na linha de acumulada 13, ou
seja, \\(x = 2\\). **Mediana = 2**.

**d)** \\(\bar x = \frac{0\cdot5 + 1\cdot4 + 2\cdot4 + 3\cdot3 + 4\cdot2 + 5\cdot1 + 6\cdot1}{20} = \frac{40}{20} = 2\\).

**e)** Desvios ao quadrado ponderados pelas frequências:

\\(var = \frac{5(0-2)^2 + 4(1-2)^2 + 4(0)^2 + 3(1)^2 + 2(2)^2 + 1(3)^2 + 1(4)^2}{20}\\)

\\(= \frac{20 + 4 + 0 + 3 + 8 + 9 + 16}{20} = \frac{60}{20} = 3\\).
]
