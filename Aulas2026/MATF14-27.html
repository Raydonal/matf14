## Modelos contínuos usados na prática

- Algumas distribuições contínuas são **mais comuns** que outras.
- A densidade tem uma **fórmula** determinada por **parâmetros**.
- As propriedades da densidade devem **refletir** as características do fenômeno analisado.

--

| Dados de ... | Modelo |
|:---|:---|
| tempo, sem valores mais prováveis que outros num intervalo | **Uniforme** |
| mensurações simétricas em forma de sino | **Normal** (próxima aula) |
| tempo de espera, duração | Exponencial, Gama (outras disciplinas) |
| proporções entre 0 e 1 | Beta (outras disciplinas) |

## Distribuição Uniforme em \\((0, 1)\\) .tempo[8–20 min]

Uma variável aleatória \\(X\\) tem distribuição **uniforme no intervalo** \\((0, 1)\\) se a sua densidade é

$$
f(x) = \begin{cases} 1, &amp; 0 \leq x \leq 1,\\\\ 0, &amp; \text{caso contrário}. \end{cases}
$$

**Notação:** \\(X \sim \text{Unif}(0, 1)\\).

--

.pull-left[
\\(f(x)\\) é uma densidade legítima, pois \\(f(x) \geq 0\\) para todo \\(x\\) e

$$
\int\_{-\infty}^{\infty} f(x)\,dx = \int\_0^1 1\,dx = 1.
$$

É a área de um **quadrado** de lado 1.
]

.pull-right[
&lt;img src="MATF14-27_files/figure-html/unif01-1.png" alt="" width="100%" /&gt;

]

---

## Cálculo de probabilidades

Seja \\(X \sim \text{Unif}(0, 1)\\). A probabilidade de \\(X\\) pertencer a um intervalo \\((a, b)\\) contido em
\\((0, 1)\\) é o **comprimento** do intervalo:

$$
P(a &amp;lt; X &amp;lt; b) = \int\_a^b f(x)\,dx = \int\_a^b 1\,dx = b - a.
$$

--

.caixa-aplicacao[
- Intervalos de **mesmo comprimento** têm **mesma probabilidade**, onde quer que estejam em \\((0, 1)\\).
- A densidade não "prefere" nenhum valor: por isso a Uniforme modela situações **sem informação** sobre
  onde o valor deve cair.
]

---

## Exemplo .tempo[20–30 min]

Seja \\(X \sim \text{Unif}(0, 1)\\). Calcule: **a)** \\(P(X &amp;lt; 0{,}8)\\); **b)** \\(P(0{,}2 &amp;lt; X &amp;lt; 0{,}9)\\); **c)** \\(P(X &amp;gt; 0{,}5)\\).

--

.caixa-resposta[
**a)** \\(P(X &amp;lt; 0{,}8) = \int\_{-\infty}^{0{,}8} f(x)\,dx = \int\_0^{0{,}8} 1\,dx = 0{,}8\\).

**b)** \\(P(0{,}2 &amp;lt; X &amp;lt; 0{,}9) = \int\_{0{,}2}^{0{,}9} 1\,dx = 0{,}7\\).

**c)** \\(P(X &amp;gt; 0{,}5) = \int\_{0{,}5}^{\infty} f(x)\,dx = \int\_{0{,}5}^{1} 1\,dx = 0{,}5\\).
]

&lt;img src="MATF14-27_files/figure-html/ex-areas-1.png" alt="" width="100%" /&gt;

## Exercício 1: média e variância da Unif(0, 1) .tempo[30–40 min]

Seja \\(X \sim \text{Unif}(0, 1)\\). Lembrando que

$$
E(X) = \int\_{-\infty}^{\infty} x\,f(x)\,dx, \qquad E(X^2) = \int\_{-\infty}^{\infty} x^2 f(x)\,dx, \qquad Var(X) = E(X^2) - [E(X)]^2,
$$

mostre que \\(E(X) = 1/2\\) e \\(Var(X) = 1/12\\).

--

.caixa-resposta[
\\(E(X) = \int\_0^1 x\,dx = \Big[\frac{x^2}{2}\Big]\_0^1 = \frac{1}{2}\\).

\\(E(X^2) = \int\_0^1 x^2\,dx = \Big[\frac{x^3}{3}\Big]\_0^1 = \frac{1}{3}\\).

\\(Var(X) = \frac{1}{3} - \left(\frac{1}{2}\right)^2 = \frac{4 - 3}{12} = \frac{1}{12}\\).
]

# Parte 2: a Uniforme em (α, β) e aplicações

### 50 minutos

---

## Distribuição Uniforme em \\((\alpha, \beta)\\) .tempo[0–12 min]

\\(X\\) tem distribuição **uniforme no intervalo** \\((\alpha, \beta)\\), \\(X \sim \text{Unif}(\alpha, \beta)\\), se

$$
f(x) = \begin{cases} \dfrac{1}{\beta - \alpha}, &amp; \alpha \leq x \leq \beta,\\\\ 0, &amp; \text{caso contrário}. \end{cases}
$$

.small[
A altura \\(1/(\beta - \alpha)\\) garante área total \\(= \text{base} \times \text{altura} = (\beta - \alpha) \cdot \frac{1}{\beta - \alpha} = 1\\).
]

--

Intervalos de **mesmo comprimento** em \\((\alpha, \beta)\\) têm **mesma probabilidade**. Para \\(\alpha \leq a &amp;lt; b \leq \beta\\):

$$
P(a &amp;lt; X &amp;lt; b) = \int\_a^b \frac{1}{\beta - \alpha}\,dx = \frac{b - a}{\beta - \alpha} = \frac{\text{comprimento do intervalo}}{\text{comprimento total}}.
$$

---

## Função de distribuição acumulada da Unif\\((\alpha, \beta)\\)

- Para \\(t &amp;lt; \alpha\\): \\(P(X \leq t) = 0\\). Para \\(t &amp;gt; \beta\\): \\(P(X \leq t) = 1\\).
- Para \\(\alpha \leq t \leq \beta\\):

$$
F(t) = P(X \leq t) = \int\_{\alpha}^{t} \frac{1}{\beta - \alpha}\,dx = \frac{t - \alpha}{\beta - \alpha}.
$$

--

.pull-left[
&lt;img src="MATF14-27_files/figure-html/d27-1.png" alt="" width="100%" /&gt;

]

.pull-right[
&lt;img src="MATF14-27_files/figure-html/F27-1.png" alt="" width="100%" /&gt;

]

.clear[]

.small[
Densidade: altura \\(1/5 = 0{,}2\\) em \\([2, 7]\\). FDA: uma **rampa** reta de 0 (em 2) até 1 (em 7).
]

---

## Média e variância da Unif\\((\alpha, \beta)\\) .tempo[12–22 min]

Usando \\(b^2 - a^2 = (b - a)(b + a)\\) e \\(b^3 - a^3 = (b - a)(b^2 + ab + a^2)\\):

$$
E(X) = \int\_{\alpha}^{\beta} x \cdot \frac{1}{\beta - \alpha}\,dx = \frac{\beta^2 - \alpha^2}{2(\beta - \alpha)} = \frac{\alpha + \beta}{2}
$$

--

$$
E(X^2) = \int\_{\alpha}^{\beta} x^2 \cdot \frac{1}{\beta - \alpha}\,dx = \frac{\beta^3 - \alpha^3}{3(\beta - \alpha)} = \frac{\alpha^2 + \alpha\beta + \beta^2}{3}
$$

--

$$
Var(X) = \frac{\alpha^2 + \alpha\beta + \beta^2}{3} - \frac{(\alpha + \beta)^2}{4} = \frac{4\alpha^2 + 4\alpha\beta + 4\beta^2 - 3\alpha^2 - 6\alpha\beta - 3\beta^2}{12} = \frac{(\beta - \alpha)^2}{12}
$$

.caixa-aplicacao[
**Média:** o **ponto médio** do intervalo. **Variância:** depende só do **comprimento** \\(\beta - \alpha\\). Com
\\(\alpha = 0\\), \\(\beta = 1\\): \\(1/2\\) e \\(1/12\\). ✓
]

---

## Exercício 2

Considere \\(X \sim \text{Unif}(0, 10)\\).

**a)** Calcule a função de distribuição acumulada de \\(X\\). **b)** Calcule \\(P(2 &amp;lt; X &amp;lt; 4)\\).
**c)** Qual é a média e a variância de \\(X\\)?

--

.caixa-resposta[
**a)** \\(F(t) = 0\\) para \\(t &amp;lt; 0\\); \\(F(t) = t/10\\) para \\(0 \leq t &amp;lt; 10\\); \\(F(t) = 1\\) para \\(t \geq 10\\).

**b)** \\(P(2 &amp;lt; X &amp;lt; 4) = F(4) - F(2) = \frac{4}{10} - \frac{2}{10} = \frac{1}{5}\\).

**c)** \\(E(X) = \frac{0 + 10}{2} = 5\\); \\(Var(X) = \frac{(10 - 0)^2}{12} = \frac{100}{12} \approx 8{,}33\\); \\(dp(X) \approx 2{,}89\\).
]

---

## Espera pelo metrô .tempo[22–30 min]

Os trens de uma linha de metrô passam **a cada 8 minutos**, pontualmente. Um passageiro chega à
estação em um instante **aleatório**, sem consultar horários. Seja \\(X\\) o tempo de espera (minutos):
\\(X \sim \text{Unif}(0, 8)\\).

**a)** Qual é a probabilidade de esperar **mais de 6 minutos**? **b)** Qual é o tempo **médio** de espera e o
desvio padrão? **c)** Em quanto tempo **90%** dos passageiros embarcam?

--

.caixa-resposta[
**a)** \\(P(X &amp;gt; 6) = \frac{8 - 6}{8} = 0{,}25\\). **b)** \\(E(X) = 4\\) minutos; \\(dp(X) = \frac{8}{\sqrt{12}} \approx 2{,}31\\) minutos.

**c)** \\(F(q) = q/8 = 0{,}9 \Rightarrow q = 7{,}2\\) minutos.
]

--

.caixa-economia[
Se o metrô passasse a cada **4** minutos, a espera média cairia **pela metade** e o desvio padrão
também. Esse é o tipo de conta que embasa decisões de **frequência** de transporte público.
]

## Preços em um leilão (modelo sem informação)

Um analista sabe apenas que o lance vencedor de um leilão de um imóvel ficará entre **R$ 200 mil** e
**R$ 320 mil**, sem nenhum valor mais provável. Seja \\(L \sim \text{Unif}(200, 320)\\) (em milhares de reais).

**a)** Qual é a probabilidade de o lance ficar **acima de R$ 290 mil**?

**b)** O imóvel só é vendido se o lance superar o valor mínimo de R$ 230 mil. Qual é a probabilidade de
venda? **c)** Dado que foi vendido, qual é a probabilidade de o lance ter passado de R$ 290 mil?

--

.caixa-resposta[
**a)** \\(\frac{320 - 290}{120} = 0{,}25\\). **b)** \\(P(L &amp;gt; 230) = \frac{90}{120} = 0{,}75\\).

**c)** \\(P(L &amp;gt; 290 \mid L &amp;gt; 230) = \frac{P(L &amp;gt; 290)}{P(L &amp;gt; 230)} = \frac{0{,}25}{0{,}75} = \frac{1}{3}\\) (Aula 11!).
]

## Da probabilidade geométrica à Uniforme: o encontro .tempo[30–38 min]

Na Aula 11, comprador e vendedor chegavam **ao acaso** entre 9h e 10h. Em linguagem desta unidade: as chegadas são
\\(X, Y \sim \text{Unif}(0, 60)\\), independentes, e "ao acaso no quadrado" é a **densidade conjunta constante** \\(1/60^2\\).

.pull-left[
- \\(P(X \leq 15) = 15/60 = 0{,}25\\): área sob a densidade Uniforme.
- \\(P(|X - Y| \leq 15) = 7/16\\): área de uma **região** do quadrado, dividida pela área total.
- Se quem chega primeiro esperasse o outro sem limite, a espera média seria \\(E(|X - Y|) = 20\\) minutos.
]

.pull-right[

``` r
set.seed(27)
x &lt;- runif(1e5, 0, 60)
y &lt;- runif(1e5, 0, 60)
mean(x &lt;= 15)           # P(X &lt;= 15)
## [1] 0.25148
mean(abs(x - y) &lt;= 15)  # encontro
## [1] 0.43625
mean(abs(x - y))        # E(|X - Y|)
## [1] 19.98958
```
]

.clear[]

.caixa-discussao[
Por que a probabilidade geométrica é um caso da Uniforme? A hipótese "chegadas ao acaso" é razoável para quem vai ao trabalho?
]

**1.** Um estudante modela a **renda mensal** de uma cidade como \\(\text{Unif}(0, 20.000)\\). Por que esse
modelo é ruim? Que característica da renda ele ignora? (Pense no histograma da Aula 04.)

**2.** Na espera pelo metrô, a Uniforme é razoável. E se os passageiros **consultarem o aplicativo** e

**3.** Geradores de números aleatórios de computador (`runif()`) produzem valores \\(\text{Unif}(0, 1)\\). Como
você usaria `runif()` para simular a espera pelo metrô, \\(\text{Unif}(0, 8)\\)?

--

.caixa-resposta[
**3.** Se \\(U \sim \text{Unif}(0, 1)\\), então \\(8U \sim \text{Unif}(0, 8)\\); em geral, \\(\alpha + (\beta - \alpha)U \sim \text{Unif}(\alpha, \beta)\\).
]

```

```

```

## Resumo

- \\(X \sim \text{Unif}(\alpha, \beta)\\): densidade **constante** \\(f(x) = \frac{1}{\beta - \alpha}\\) em \\([\alpha, \beta]\\).
- \\(P(a &amp;lt; X &amp;lt; b) = \frac{b - a}{\beta - \alpha}\\): probabilidade proporcional ao **comprimento**.
- **FDA:** \\(F(t) = \frac{t - \alpha}{\beta - \alpha}\\) em \\([\alpha, \beta]\\) (0 antes, 1 depois).
- \\(E(X) = \frac{\alpha + \beta}{2}\\) e \\(Var(X) = \frac{(\beta - \alpha)^2}{12}\\).
- Caso particular: \\(\text{Unif}(0, 1)\\), com \\(E = 1/2\\) e \\(Var = 1/12\\), base dos geradores de números aleatórios.
