# Aula 03: Tabelas e gráficos

### Provocação · Teoria · Aplicação · Discussão · Uso do R

---

## Um gráfico pode enganar sem uma única mentira

&gt; Um relatório de vendas mostra um gráfico de barras com o eixo y começando em R\$ 40.000 (não em
&gt; zero). Diferenças de poucos milhares parecem enormes. Nenhum número no gráfico está errado, o
&gt; que está errado, então?

--

&gt; Um jornal usa um gráfico de pizza com 9 fatias para mostrar participação setorial no PIB. Duas
&gt; fatias vizinhas têm 9% e 11%. É fácil dizer qual é maior só olhando?

--

Hoje: as regras que separam "gráfico correto" de "gráfico tecnicamente correto, mas enganoso".

# Bloco 1: Teoria

---

## Tabela de frequências

Para \(f_i\) casos na categoria \(i\), de um total \(n=\sum_i f_i\):

$$
\text{Proporção}_i = \frac{f_i}{n}, \qquad \text{Porcentagem}_i = 100\times\frac{f_i}{n}\,\%
$$

--

## Tabela de dupla entrada

Cruza duas variáveis qualitativas. Dividir pelo total da **linha** (não do total geral) dá a
composição condicional daquele grupo, essencial para comparar grupos de tamanhos diferentes.

---

## Gráfico certo para cada tipo de variável

| Variável | Gráfico típico |
|---|---|
| Qualitativa (poucas categorias) | Barras, setores (pizza) |
| Quantitativa discreta (poucos valores) | Barras |
| Quantitativa contínua | Histograma |
| Série temporal (qualquer tipo) | Linha, respeitando a ordem no tempo |

--

**Erro comum**: usar gráfico de linha para conectar categorias *sem ordem numérica*, sugere uma
tendência que não existe.

# Bloco 2: Aplicação

---

## Um histograma que já é uma tabela de frequências

&lt;img src="images/gender_pay_gap.png" alt="" width="75%" /&gt;

78% das empresas britânicas pagam mais aos homens, a notícia usa exatamente uma tabela de
frequências (900 empresas, agrupadas por faixa de diferença salarial), não uma média isolada.

---

## Tabela de frequências: setor de atividade


``` r
empresas |&gt; count(setor, sort = TRUE) |&gt;
  mutate(pct = round(100*n/sum(n), 1))
```

```
##                         setor  n  pct
## 1                 Embalagens  31 29.2
## 2                  Industrial 17 16.0
## 3         Laminados plásticos 17 16.0
## 4        Domiciliar e pessoal 16 15.1
## 5                     Outros  13 12.3
## 6 Manilhas, canos e conexões  12 11.3
```

---

## Gráfico de barras


``` r
ggplot(empresas, aes(x = fct_infreq(setor))) +
  geom_bar(fill = "#0d3b54") + coord_flip() +
  labs(x = NULL, y = "Nº de empresas") + theme_minimal(base_size = 13)
```

&lt;img src="MATF14-03_files/figure-html/grafico-barras-1.png" alt="" width="504" /&gt;

---

## Histograma


``` r
ggplot(empresas, aes(x = faturamento99)) +
  geom_histogram(bins = 20, fill = "#c9971e", color = "white") +
  labs(x = "Faturamento 1999 (R$ mil)", y = "Frequência") + theme_minimal(base_size = 13)
```

&lt;img src="MATF14-03_files/figure-html/histograma-1.png" alt="" width="504" /&gt;

# Bloco 4: Uso do R

---

## Tabela + gráfico, do dado bruto ao resultado


``` r
library(tidyverse)
empresas &lt;- read.csv("empresas.csv")

# tabela de frequências
empresas |&gt; count(setor, sort = TRUE) |&gt;
  mutate(pct = round(100*n/sum(n), 1))

# gráfico de barras ordenado por frequência
ggplot(empresas, aes(x = fct_infreq(setor))) +
  geom_bar(fill = "#0d3b54") + coord_flip()

# histograma com número de classes ajustado
ggplot(empresas, aes(x = faturamento99)) +
  geom_histogram(bins = 20, fill = "#c9971e", color = "white")
```

`fct_infreq()` reordena os níveis de um fator pela frequência, essencial para gráficos de barra
legíveis. `bins =` no histograma sempre deve ser testado com mais de um valor.

---
